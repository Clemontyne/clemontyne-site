<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="circleClip">
      <circle cx="32" cy="32" r="29"/>
    </clipPath>
  </defs>

  <!-- rind -->
  <circle cx="32" cy="32" r="30.5" fill="#fbe0c8"/>

  <!-- four citrus quadrants -->
  <g clip-path="url(#circleClip)">
    <path d="M32,32 L32,3 A29,29 0 0,1 61,32 Z" fill="#e8762e"/>
    <path d="M32,32 L61,32 A29,29 0 0,1 32,61 Z" fill="#6fa97d"/>
    <path d="M32,32 L32,61 A29,29 0 0,1 3,32 Z" fill="#f0d477"/>
    <path d="M32,32 L3,32 A29,29 0 0,1 32,3 Z" fill="#fbe0c8"/>

    <!-- wedge divider lines, citrus-segment style -->
    <g stroke="#ffffff" stroke-width="1.4" opacity="0.85">
      <line x1="32" y1="32" x2="32" y2="3"/>
      <line x1="32" y1="32" x2="47.4" y2="6.9"/>
      <line x1="32" y1="32" x2="57.1" y2="17.6"/>
      <line x1="32" y1="32" x2="61" y2="32"/>
      <line x1="32" y1="32" x2="57.1" y2="46.4"/>
      <line x1="32" y1="32" x2="47.4" y2="57.1"/>
      <line x1="32" y1="32" x2="32" y2="61"/>
      <line x1="32" y1="32" x2="16.6" y2="57.1"/>
      <line x1="32" y1="32" x2="6.9" y2="46.4"/>
      <line x1="32" y1="32" x2="3" y2="32"/>
      <line x1="32" y1="32" x2="6.9" y2="17.6"/>
      <line x1="32" y1="32" x2="16.6" y2="6.9"/>
    </g>
  </g>

  <!-- rind outline -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fbe0c8" stroke-width="2.4"/>

  <!-- pith center -->
  <circle cx="32" cy="32" r="8" fill="#fdf8ef"/>
</svg>
