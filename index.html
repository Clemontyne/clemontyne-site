@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{
--paper: #fcfcfa;
--ink: #2a3328;
--ink-soft: #5b6b57;
--line: #e7e2d3;
--leaf: #6fa97d;
--leaf-deep: #467356;
--leaf-pale: #dcecdf;
--citrus: #e8762e;
--citrus-deep:#c15f20;
--citrus-pale:#fbe0c8;
--zest: #f0d477;
--zest-pale: #faf1d3;
--card: #ffffff;
--shadow: 0 12px 32px rgba(42,51,40,0.07);
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; font-size:16px; line-height:1.6; }
h1,h2,h3,h4{ font-family:'Fraunces',serif; font-weight:600; line-height:1.15; margin:0; color:var(--ink); }
p{ margin:0; color:var(--ink-soft); }
a{ color:inherit; text-decoration:none; }
img,svg{ display:block; max-width:100%; }
.wrap{ max-width:1120px; margin:0 auto; padding:0 32px; }
.nav{ display:flex; align-items:center; justify-content:space-between; padding:22px 0; border-bottom:1px solid var(--line);
position:sticky; top:0; background:var(--paper); z-index:10; }
.nav .wrap{ display:flex; align-items:center; justify-content:space-between; width:100%; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ position:relative; width:32px; height:32px; border-radius:50%; flex-shrink:0;
background:conic-gradient(var(--citrus) 0deg 90deg, var(--leaf) 90deg 180deg, var(--zest) 180deg 270deg, var(--citrus-pale) 270deg 360deg);
border:2px solid var(--citrus-pale); box-shadow:inset 0 0 0 1px rgba(255,255,255,.5); }
.brand-mark::before{ content:''; position:absolute; inset:0; border-radius:50%;
background:repeating-conic-gradient(from 0deg, transparent 0deg 27deg, rgba(255,255,255,.85) 27deg 30deg); }
.brand-mark::after{ content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
width:26%; height:26%; border-radius:50%; background:#fdf8ef; }
.brand-name{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
.nav-links{ display:flex; align-items:center; gap:30px; font-size:14.5px; font-weight:500; color:var(--ink-soft); }
.nav-links a:hover{ color:var(--citrus-deep); }
.btn{ display:inline-flex; align-items:center; gap:6px; background:var(--citrus); color:#fff; padding:11px 22px; border-radius:10px;
font-size:14.5px; font-weight:700; border:none; cursor:pointer; font-family:'Inter',sans-serif; transition:background .15s ease, transform .15s ease; }
.btn:hover{ background:var(--citrus-deep); transform:translateY(-1px); }
.btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
.btn-ghost:hover{ background:var(--leaf-pale); border-color:var(--leaf); }
.hero{ padding:76px 0 40px; scroll-margin-top:90px; }
.eyebrow{ display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--citrus-deep); margin-bottom:16px; }
.hero h1{ font-size:46px; max-width:680px; margin-bottom:20px; }
.hero .lede{ font-size:18px; max-width:560px; margin-bottom:32px; }
.hero-actions{ display:flex; gap:14px; flex-wrap:wrap; }
.peel-divider{ width:100%; height:64px; display:block; margin-top:40px; }
.section{ padding:56px 0; scroll-margin-top:90px; }
.section.tight{ padding:36px 0; }
.section-head{ max-width:600px; margin-bottom:36px; }
.section-head .eyebrow{ margin-bottom:10px; }
.section-head h2{ font-size:30px; margin-bottom:12px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px 24px; box-shadow:var(--shadow); }
.card h3{ font-size:18px; margin-bottom:10px; }
.card p{ font-size:14.5px; }
.card .tag{ display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:14px; }
.tag.leaf{ background:var(--leaf-pale); color:var(--leaf-deep); }
.tag.citrus{ background:var(--citrus-pale); color:var(--citrus-deep); }
.tag.zest{ background:var(--zest-pale); color:#8a7422; }
.band{ background:var(--ink); color:var(--paper); border-radius:20px; padding:42px 40px;
display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; }
.band h3{ color:var(--paper); font-size:24px; margin-bottom:8px; }
.band p{ color:#c9d3c6; max-width:460px; }
.band .btn{ background:var(--zest); color:#4a3f10; }
.band .btn:hover{ background:#e6c95e; }
.price-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:28px 24px; display:flex; flex-direction:column; gap:14px; }
.price-card.featured{ border:2px solid var(--citrus); position:relative; }
.price-card.featured::before{ content:"Most chosen"; position:absolute; top:-12px; left:24px; background:var(--citrus); color:#fff;
font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; letter-spacing:.03em; }
.price-name{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
.price-value{ font-family:'Fraunces',serif; font-size:36px; }
.price-list{ list-style:none; padding:0; margin:0; font-size:14px; color:var(--ink-soft); display:flex; flex-direction:column; gap:8px; }
.price-list li::before{ content:"— "; color:var(--leaf-deep); font-weight:700; }
.strip{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border:1px solid var(--line); border-radius:14px;
background:var(--card); margin-bottom:12px; flex-wrap:wrap; gap:10px; }
.strip h4{ font-size:15.5px; }
.strip p{ font-size:13.5px; }
.strip .amount{ font-family:'Fraunces',serif; font-size:20px; color:var(--citrus-deep); white-space:nowrap; }
.case-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 28px;
display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:center; margin-bottom:20px; }
.case-visual{ background:var(--leaf-pale); border-radius:14px; height:180px; display:flex; align-items:center; justify-content:center;
color:var(--leaf-deep); font-family:'Fraunces',serif; font-size:15px; text-align:center; padding:20px; overflow:hidden; }
.case-visual img{ width:100%; height:100%; object-fit:cover; border-radius:14px; }
.case-visual.alt{ background:var(--citrus-pale); color:var(--citrus-deep); }
.case-card{ cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
.case-card:hover{ transform:translateY(-2px); box-shadow:0 16px 36px rgba(42,51,40,0.1); }
.case-card .open-hint{ font-size:12.5px; color:var(--citrus-deep); font-weight:600; margin-top:10px; display:inline-block; }
.team-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
.team-card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px 26px;
display:flex; gap:20px; align-items:flex-start; box-shadow:var(--shadow); }
.team-photo{ width:88px; height:88px; border-radius:50%; object-fit:cover; flex-shrink:0; border:3px solid var(--leaf-pale); }
.team-name{ font-family:'Fraunces',serif; font-size:19px; margin-bottom:2px; }
.team-role{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--citrus-deep); margin-bottom:10px; display:block; }
.team-bio{ font-size:14px; color:var(--ink-soft); }
.modal-overlay{ position:fixed; inset:0; background:rgba(42,51,40,0.55); display:none; align-items:flex-start; justify-content:center;
padding:40px 20px; z-index:100; overflow-y:auto; }
.modal-overlay.open{ display:flex; }
.modal-box{ background:var(--paper); border-radius:20px; max-width:760px; width:100%; padding:0; overflow:hidden; margin-bottom:40px; }
.modal-gallery{ position:relative; background:var(--ink); height:360px; display:flex; align-items:center; justify-content:center; }
.modal-gallery img{ width:100%; height:100%; object-fit:cover; }
.modal-gallery .empty{ color:#c9d3c6; font-family:'Fraunces',serif; }
.modal-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.9); border:none;
width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:700; color:var(--ink); }
.modal-nav.prev{ left:14px; } .modal-nav.next{ right:14px; }
.modal-dots{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:6px; }
.modal-dots span{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.5); }
.modal-dots span.active{ background:#fff; }
.modal-close{ position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.9); border:none; width:32px; height:32px;
border-radius:50%; cursor:pointer; font-size:16px; font-weight:700; z-index:2; }
.modal-body{ padding:32px 36px 36px; }
.modal-body h3{ font-size:24px; margin-bottom:18px; }
.modal-section{ margin-bottom:18px; }
.modal-section h4{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--citrus-deep); font-weight:700; margin-bottom:6px; }
.modal-section p{ font-size:14.5px; color:var(--ink-soft); }
.footer{ border-top:1px solid var(--line); padding:36px 0; margin-top:40px; }
.footer .wrap{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; }
.footer p{ font-size:13px; }
.contact-card{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:40px; text-align:center; max-width:560px; margin:0 auto; }
.contact-card h2{ font-size:26px; margin-bottom:10px; }
.contact-card p{ margin-bottom:26px; }
.contact-email{ display:inline-block; font-family:'Fraunces',serif; font-size:20px; color:var(--citrus-deep);
border-bottom:2px solid var(--citrus-pale); padding-bottom:4px; margin-bottom:26px; }
.contact-meta{ font-size:13px; color:var(--ink-soft); margin-top:18px; }
.skeleton{ opacity:0.35; }
.bg-watermark{
position:fixed;
top:50%; left:50%;
transform:translate(-50%,-46%);
width:1100px; height:1100px;
opacity:0.05;
z-index:0;
pointer-events:none;

.bg-watermark svg{ width:100%; height:100%; }
.nav, .section, .hero, .footer{ position:relative; z-index:1; }
@media (max-width:860px){
.nav-links{ display:none; }
.hero h1{ font-size:34px; }
.grid-3{ grid-template-columns:1fr; }
.grid-2{ grid-template-columns:1fr; }
.case-card{ grid-template-columns:1fr; }
.band{ flex-direction:column; align-items:flex-start; }
.team-grid{ grid-template-columns:1fr; }
.team-card{ flex-direction:column; align-items:center; text-align:center; }
}
</style>

<script>
// ---- CONFIGURE THESE TWO VALUES (same as admin.html) ----
const SUPABASE_URL = "https://zltwnysydqzvxcuhkhmu.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsdHdueXN5ZHF6dnhjdWhraG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTY5NjgsImV4cCI6MjEwMTUzMjk2OH0.uctNLPxGfEscLq2PTnPZ1RL3GmTJtu7INXGx8s3rrR4";
// -----------------------------------------------------------

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function setText(id, value){
const el = document.getElementById('t-' + id);
if(el) el.textContent = value || '';
}

async function loadSiteText(){
const { data, error } = await sb.from('site_text').select('*');
if(error || !data){ console.error('site_text load failed', error); return; }
const map = {};
data.forEach(row => map[row.key] = row.value);
Object.keys(map).forEach(key => setText(key, map[key]));

// contact email needs special handling (href + label)
const email = map['contact_email'] || 'hello@clemontyne.com';
const emailLink = document.getElementById('t-contact_email_link');
if(emailLink){ emailLink.textContent = email; emailLink.href = 'mailto:' + email; }
const emailBtn = document.getElementById('t-contact_email_btn');
if(emailBtn){ emailBtn.href = 'mailto:' + email; }
}

function tagClass(i){
return ['citrus','leaf','zest'][i % 3];
}

async function loadSimpleCards(group, containerId, tagVariant){
const { data, error } = await sb.from('cards').select('*').eq('group_key', group).eq('visible', true).order('sort_order');
const container = document.getElementById(containerId);
if(error || !container) return;
container.innerHTML = '';
(data || []).forEach((card, i) => {
const div = document.createElement('div');
div.className = 'card';
div.innerHTML = `
${card.tag ? `<span class="tag ${tagClass(i)}">${card.tag}</span>` : ''}
<h3>${card.title || ''}</h3>
<p>${card.body || ''}</p>
`;
container.appendChild(div);
});
}

async function loadServiceCards(){
const { data, error } = await sb.from('cards').select('*').eq('group_key','services_systems').eq('visible', true).order('sort_order');
const container = document.getElementById('cards-services_systems');
if(error || !container) return;
container.innerHTML = '';
(data || []).forEach((card, i) => {
const featuresHtml = (card.features || []).map(f => `<li>${f}</li>`).join('');
const div = document.createElement('div');
div.className = 'card';
div.innerHTML = `
<span class="tag ${tagClass(i)}">${card.tag || ''}</span>
<h3>${card.title || ''}</h3>
<p>${card.body || ''}</p>

async function loadWorkCards(){
const { data, error } = await sb.from('cards').select('*').eq('group_key','work').eq('visible', true).order('sort_order');
const container = document.getElementById('cards-work');
if(!container) return;
const dynamicCards = (!error && data) ? data : [];
caseStudies = [...staticCaseStudies, ...dynamicCards];
container.innerHTML = '';
caseStudies.forEach((card, i) => {
const visualHtml = card.image_url
? `<img src="${card.image_url}" alt="${card.title || ''}">`
: (card.tag || '');
const div = document.createElement('div');
div.className = 'case-card';
div.innerHTML = `
<div class="case-visual ${i % 2 === 1 ? 'alt' : ''}">${visualHtml}</div>
<div>
<span class="tag ${tagClass(i)}">${card.tag || ''}</span>
<h3>${card.title || ''}</h3>
<p>${card.body || ''}</p>
<span class="open-hint">View the full breakdown →</span>
</div>
`;
div.addEventListener('click', () => openCaseModal(i));
container.appendChild(div);
});
}

function openCaseModal(i){
const card = caseStudies[i];
if(!card) return;
galleryIndex = 0;
document.getElementById('modal-tag').textContent = card.tag || '';
document.getElementById('modal-title').textContent = card.title || '';
setModalSection('need', card.need_text);
setModalSection('built', card.built_text || card.body);
setModalSection('outcome', card.outcome_text);
window._currentGallery = (card.gallery_images && card.gallery_images.length) ? card.gallery_images : (card.image_url ? [card.image_url] : []);
renderGallery();
document.getElementById('case-modal').classList.add('open');
}

function setModalSection(key, value){
const wrap = document.getElementById('modal-' + key + '-wrap');
const el = document.getElementById('modal-' + key);
if(value && value.trim()){
wrap.style.display = 'block';
el.textContent = value;
} else {
wrap.style.display = 'none';
}
}

function renderGallery(){
const gallery = document.getElementById('modal-gallery');
const images = window._currentGallery || [];
let inner = `<button class="modal-close" onclick="closeCaseModal()">&times;</button>`;
if(images.length === 0){
inner += `<div class="empty">No screenshots yet</div>`;
} else {
inner += `<img src="${images[galleryIndex]}" alt="">`;
if(images.length > 1){
inner += `
<button class="modal-nav prev" onclick="shiftGallery(-1)">&#8249;</button>
<button class="modal-nav next" onclick="shiftGallery(1)">&#8250;</button>
<div class="modal-dots">${images.map((_,idx) => `<span class="${idx===galleryIndex?'active':''}"></span>`).join('')}</div>
`;
}
}
gallery.innerHTML = inner;
}

function shiftGallery(dir){
const images = window._currentGallery || [];
if(images.length === 0) return;
galleryIndex = (galleryIndex + dir + images.length) % images.length;
renderGallery();
}

function closeCaseModal(){
document.getElementById('case-modal').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', () => {
document.getElementById('case-modal').addEventListener('click', (e) => {
if(e.target.id === 'case-modal') closeCaseModal();
});
});
